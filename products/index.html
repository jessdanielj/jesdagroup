<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JESDA - Product Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .strike-through { text-decoration: line-through; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- Header / Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="text-2xl font-bold tracking-tight text-blue-600">JESDA</div>
            
            <!-- Currency Switcher Control -->
            <div class="flex items-center space-x-2 bg-gray-100 p-1 rounded-lg">
                <button id="btn-INR" onclick="setCurrency('INR')" class="px-3 py-1.5 rounded-md text-sm font-semibold transition bg-white text-blue-600 shadow">INR (₹)</button>
                <button id="btn-USD" onclick="setCurrency('USD')" class="px-3 py-1.5 rounded-md text-sm font-semibold transition text-gray-600 hover:text-gray-900">USD ($)</button>
            </div>
        </div>
    </header>

    <!-- Main Storefront Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">Our Products</h1>
                <p class="mt-2 text-sm text-gray-500">Live synchronized operational components inventory.</p>
            </div>
            
            <!-- Category Filtering Links -->
            <div class="flex flex-wrap gap-2">
                <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-blue-600 text-white">All</button>
                <button onclick="filterCategory('electronics')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">Electronics</button>
                <button onclick="filterCategory('solar')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">Solar</button>
                <button onclick="filterCategory('hardware')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">Hardware</button>
            </div>
        </div>

        <!-- Dynamic Product Catalog Grid Grid -->
        <div id="product-display-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading Indicator Dynamic Shell Placeholder -->
            <div class="col-span-full text-center py-20 text-gray-500 font-medium">
                Synchronizing secure matrix architecture...
            </div>
        </div>
    </main>

    <!-- Global Application Engine Controller Script -->
    <script>
        // Set the active Cloudflare Worker backend API endpoint route verbatim
        const apiEndpoint = "https://jesda-products-api.jessdaniel-j.workers.dev";
        
        let productInventory = [];
        let currentCurrency = 'INR';
        let currentCategory = 'all';

        // Initialize Application Lifecycle Sync Pipeline
        document.addEventListener("DOMContentLoaded", fetchLiveInventory);

        async function fetchLiveInventory() {
            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error("API Connection Failed");
                
                productInventory = await response.json();
                renderStorefront();
            } catch (error) {
                console.error("Database sync routing error:", error);
                document.getElementById('product-display-grid').innerHTML = `
                    <p class="col-span-full text-center text-red-500 font-semibold py-12">
                        Unable to securely synchronize database tables. Please refresh or contact support.
                    </p>`;
            }
        }

        function renderStorefront() {
            const grid = document.getElementById('product-display-grid');
            grid.innerHTML = '';

            const filteredProducts = productInventory.filter(product => {
                return currentCategory === 'all' || product.category.toLowerCase() === currentCategory.toLowerCase();
            });

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12">No products found in this category.</p>`;
                return;
            }

            filteredProducts.forEach(product => {
                const price = currentCurrency === 'INR' ? product.priceINR : product.priceUSD;
                const originalPrice = currentCurrency === 'INR' ? product.originalINR : product.originalUSD;
                const symbol = currentCurrency === 'INR' ? '₹' : '$';
                
                // Determine if item displays an active markdown retail discount structure
                const hasDiscount = originalPrice > price;

                const cardHtml = `
                    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden flex flex-col group hover:shadow-md transition duration-200">
                        <div class="aspect-video w-full bg-gray-100 relative overflow-hidden">
                            <div class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm font-medium">
                                [Img: ${product.img}]
                            </div>
                        </div>
                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between gap-2 mb-2">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">${product.category}</span>
                                    <span class="text-xs text-gray-400 font-mono">${product.sku}</span>
                                </div>
                                <h3 class="text-lg font-bold text-gray-900 group-hover:text-blue-600 transition duration-150">${product.name}</h3>
                            </div>
                            <div class="mt-6 pt-4 border-t border-gray-100 flex items-baseline gap-2">
                                <span class="text-2xl font-extrabold text-gray-900">${symbol}${price.toLocaleString()}</span>
                                ${hasDiscount ? `<span class="text-sm text-gray-400 strike-through font-medium">${symbol}${originalPrice.toLocaleString()}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Toggle UI Currency Controls State Matrix
        function setCurrency(currency) {
            currentCurrency = currency;
            const btnINR = document.getElementById('btn-INR');
            const btnUSD = document.getElementById('btn-USD');

            if (currency === 'INR') {
                btnINR.className = "px-3 py-1.5 rounded-md text-sm font-semibold transition bg-white text-blue-600 shadow";
                btnUSD.className = "px-3 py-1.5 rounded-md text-sm font-semibold transition text-gray-600 hover:text-gray-900";
            } else {
                btnUSD.className = "px-3 py-1.5 rounded-md text-sm font-semibold transition bg-white text-blue-600 shadow";
                btnINR.className = "px-3 py-1.5 rounded-md text-sm font-semibold transition text-gray-600 hover:text-gray-900";
            }
            renderStorefront();
        }

        // Handle Active Selection State Styling Filters
        function filterCategory(category) {
            currentCategory = category;
            const buttons = document.querySelectorAll('.cat-btn');
            
            buttons.forEach(btn => {
                if (btn.textContent.toLowerCase() === category.toLowerCase() || (category === 'all' && btn.textContent === 'All')) {
                    btn.className = "cat-btn px-4 py-2 rounded-full text-sm font-medium bg-blue-600 text-white";
                } else {
                    btn.className = "cat-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-gray-300 hover:bg-gray-50";
                }
            });
            renderStorefront();
        }
    </script>
</body>
</html>
