<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JESDA - Product Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .strike-through { text-decoration: line-through; }
        .cart-drawer {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .cart-drawer.open {
            transform: translateX(0);
        }
        /* Custom deep navy matching the site brand matrix */
        .bg-brand-navy { color: #ffffff; background-color: #0b1a30; }
        .text-brand-green { color: #10b981; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 overflow-x-hidden">

    <!-- Header Block (Matched to Corporate Identity Style Matrix) -->
    <header class="bg-brand-navy shadow-md sticky top-0 z-40 pb-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 flex flex-col items-center text-center">
            
            <!-- Centered Header Logo Block -->
            <a href="../" class="text-3xl font-bold tracking-[0.25em] text-white hover:text-gray-200 transition">
                JESDA
            </a>
            <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-brand-green mt-2 mb-4">
                Trading · Sourcing · Business Support
            </p>

            <!-- Navigation Links Frame -->
            <nav class="flex space-x-6 text-xs uppercase tracking-widest font-semibold mb-4">
                <a href="../" class="text-gray-400 hover:text-white transition">Home</a>
                <a href="./" class="text-brand-green font-bold transition">Products</a>
                <a href="../services/" class="text-gray-400 hover:text-white transition">Services</a>
                <a href="../contact/" class="text-gray-400 hover:text-white transition">Contact</a>
            </nav>
        </div>

        <!-- System Controls Floating Tray (Currency Switching & Active Cart Actions) -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between border-t border-gray-800 pt-3">
            <div class="flex items-center space-x-2 bg-gray-900/60 p-1 rounded-lg border border-gray-800">
                <button id="btn-INR" onclick="setCurrency('INR')" class="px-3 py-1 rounded-md text-xs font-bold transition bg-blue-600 text-white shadow">INR (₹)</button>
                <button id="btn-USD" onclick="setCurrency('USD')" class="px-3 py-1 rounded-md text-xs font-bold transition text-gray-400 hover:text-white">USD ($)</button>
            </div>

            <button onclick="toggleCart(true)" class="relative p-2 text-gray-400 hover:text-white transition focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-brand-green text-gray-950 text-[10px] font-black rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </header>

    <!-- Side View Checkout Sliding Panel -->
    <div id="cart-overlay" onclick="toggleCart(false)" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity opacity-0"></div>
    <div id="cart-sidebar" class="cart-drawer fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-50 flex flex-col">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between bg-gray-50">
            <h2 class="text-lg font-bold text-gray-900 tracking-tight">Your Cart</h2>
            <button onclick="toggleCart(false)" class="p-2 text-gray-400 hover:text-gray-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div id="cart-items-list" class="p-6 flex-1 overflow-y-auto space-y-4">
            <p class="text-center text-gray-400 py-12 text-sm">Your cart is currently empty.</p>
        </div>
        <div class="p-6 border-t border-gray-100 bg-gray-50">
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-semibold text-gray-500">Subtotal Amount:</span>
                <span id="cart-total-price" class="text-xl font-extrabold text-gray-900">₹0</span>
            </div>
            <button onclick="proceedToWhatsAppCheckout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-center font-bold py-3 rounded-xl transition shadow">
                Proceed to WhatsApp Order
            </button>
        </div>
    </div>

    <!-- Product Catalog Main Grid Framework -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="mb-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6 border-b border-gray-200 pb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">Our Products</h1>
                <p class="mt-1 text-xs text-gray-500">Live synchronized procurement and operational components inventory.</p>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white transition">All</button>
                <button onclick="filterCategory('electronics')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition">Electronics</button>
                <button onclick="filterCategory('solar')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition">Solar</button>
                <button onclick="filterCategory('hardware')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition">Hardware</button>
            </div>
        </div>

        <div id="product-display-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Items injection engine space -->
        </div>
    </main>

    <script>
        const apiEndpoint = "https://jesda-products-api.jessdaniel-j.workers.dev";
        
        let productInventory = [];
        let shoppingCart = [];
        let currentCurrency = 'INR';
        let currentCategory = 'all';

        // Initialize Lifecycle with Cache Verification
        document.addEventListener("DOMContentLoaded", () => {
            const cachedData = localStorage.getItem('jesda_inventory_cache');
            if (cachedData) {
                try {
                    productInventory = JSON.parse(cachedData);
                    renderStorefront();
                } catch(e) { console.error("Cache read fail", e); }
            } else {
                document.getElementById('product-display-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-400 text-sm font-medium">
                        Synchronizing secure data matrix...
                    </div>`;
            }
            fetchLiveInventory();
        });

        async function fetchLiveInventory() {
            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error("API Route Sync Unreachable");
                
                const freshData = await response.json();
                productInventory = freshData;
                
                // Write into client cache matrix to avoid future loading loops
                localStorage.setItem('jesda_inventory_cache', JSON.stringify(freshData));
                renderStorefront();
            } catch (error) {
                console.error("Database connection failure:", error);
                if (productInventory.length === 0) {
                    document.getElementById('product-display-grid').innerHTML = `
                        <p class="col-span-full text-center text-red-500 text-sm font-semibold py-12">
                            Unable to securely synchronize database tables. Please refresh or check connection.
                        </p>`;
                }
            }
        }

        function renderStorefront() {
            const grid = document.getElementById('product-display-grid');
            grid.innerHTML = '';

            const filteredProducts = productInventory.filter(p => 
                currentCategory === 'all' || p.category.toLowerCase() === currentCategory.toLowerCase()
            );

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12 text-sm">No items matching criteria found.</p>`;
                return;
            }

            filteredProducts.forEach(product => {
                const price = currentCurrency === 'INR' ? product.priceINR : product.priceUSD;
                const originalPrice = currentCurrency === 'INR' ? product.originalINR : product.originalUSD;
                const symbol = currentCurrency === 'INR' ? '₹' : '$';
                const hasDiscount = originalPrice > price;

                const imagePath = product.img.startsWith('/') ? product.img.substring(1) : product.img;
                const finalImgSrc = `../${imagePath}`;

                const cardHtml = `
                    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden flex flex-col group hover:shadow-md transition duration-200">
                        <div class="aspect-video w-full bg-gray-100 overflow-hidden relative">
                            <img src="${finalImgSrc}" alt="${product.name}" 
                                 class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                                 onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'absolute inset-0 flex items-center justify-center text-gray-400 text-xs font-mono bg-gray-100\'>Missing: ${imagePath}</div>';">
                        </div>
                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between gap-2 mb-2">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded-full">${product.category}</span>
                                    <span class="text-xs text-gray-400 font-mono">${product.sku}</span>
                                </div>
                                <h3 class="text-base font-bold text-gray-900 group-hover:text-blue-600 transition duration-150">${product.name}</h3>
                            </div>
                            
                            <div class="mt-6 pt-4 border-t border-gray-100">
                                <div class="flex items-baseline gap-2 mb-4">
                                    <span class="text-xl font-extrabold text-gray-900">${symbol}${price.toLocaleString()}</span>
                                    ${hasDiscount ? `<span class="text-xs text-gray-400 strike-through font-medium">${symbol}${originalPrice.toLocaleString()}</span>` : ''}
                                </div>

                                <div class="flex items-center space-x-2">
                                    <div class="flex items-center border border-gray-200 rounded-lg bg-gray-50 shadow-sm">
                                        <button onclick="adjustInputQty('${product.id}', -1)" class="px-2 py-1 text-gray-500 hover:text-gray-800 font-bold text-sm">-</button>
                                        <input type="number" id="qty-${product.id}" value="1" min="1" class="w-8 text-center bg-transparent text-xs font-bold focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                                        <button onclick="adjustInputQty('${product.id}', 1)" class="px-2 py-1 text-gray-500 hover:text-gray-800 font-bold text-sm">+</button>
                                    </div>
                                    <button onclick="addToCart('${product.id}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition shadow-sm">
                                        Add to Cart
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function adjustInputQty(productId, amount) {
            const input = document.getElementById(`qty-${productId}`);
            let currentVal = parseInt(input.value) || 1;
            currentVal += amount;
            if (currentVal < 1) currentVal = 1;
            input.value = currentVal;
        }

        function addToCart(productId) {
            const product = productInventory.find(p => p.id === productId);
            const qtyInput = document.getElementById(`qty-${productId}`);
            const quantity = parseInt(qtyInput.value) || 1;

            if (!product) return;

            const existingItem = shoppingCart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                shoppingCart.push({ ...product, quantity });
            }

            qtyInput.value = 1;
            updateCartUI();
            toggleCart(true);
        }

        function updateCartUI() {
            const itemsList = document.getElementById('cart-items-list');
            const cartCountElement = document.getElementById('cart-count');
            const totalPriceElement = document.getElementById('cart-total-price');
            const symbol = currentCurrency === 'INR' ? '₹' : '$';

            itemsList.innerHTML = '';
            let totalCount = 0;
            let totalPrice = 0;

            if (shoppingCart.length === 0) {
                itemsList.innerHTML = `<p class="text-center text-gray-400 py-12 text-sm">Your cart is currently empty.</p>`;
                cartCountElement.classList.add('hidden');
                totalPriceElement.textContent = `${symbol}0`;
                return;
            }

            shoppingCart.forEach(item => {
                const price = currentCurrency === 'INR' ? item.priceINR : item.priceUSD;
                const itemTotal = price * item.quantity;
                totalCount += item.quantity;
                totalPrice += itemTotal;

                itemsList.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                        <div class="flex-1 min-w-0 pr-2">
                            <h4 class="text-xs font-bold text-gray-900 truncate">${item.name}</h4>
                            <p class="text-[11px] text-gray-500 mt-0.5">${symbol}${price.toLocaleString()} × ${item.quantity}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-extrabold text-gray-900">${symbol}${itemTotal.toLocaleString()}</span>
                            <button onclick="removeFromCart('${item.id}')" class="text-red-500 hover:text-red-700 text-[10px] font-bold">Remove</button>
                        </div>
                    </div>`);
            });

            cartCountElement.textContent = totalCount;
            cartCountElement.classList.remove('hidden');
            totalPriceElement.textContent = `${symbol}${totalPrice.toLocaleString()}`;
        }

        function removeFromCart(productId) {
            shoppingCart = shoppingCart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // WhatsApp Checkout Engine Integration Pipeline
        function proceedToWhatsAppCheckout() {
            if (shoppingCart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            // Replace with your operational business WhatsApp number (include country code, no + signs or spaces)
            const businessPhoneNumber = "966534657213"; 
            const symbol = currentCurrency === 'INR' ? '₹' : '$';
            
            let totalAmount = 0;
            let messageOrderLines = "";

            shoppingCart.forEach((item, index) => {
                const price = currentCurrency === 'INR' ? item.priceINR : item.priceUSD;
                const itemTotal = price * item.quantity;
                totalAmount += itemTotal;
                
                messageOrderLines += `${index + 1}. *${item.name}* (${item.sku})\n`;
                messageOrderLines += `    Qty: ${item.quantity} × ${symbol}${price.toLocaleString()}\n`;
                messageOrderLines += `    Total: ${symbol}${itemTotal.toLocaleString()}\n\n`;
            });

            let WhatsAppText = `*JESDA - NEW ORDER INQUIRY*\n`;
            WhatsAppText += `=========================\n\n`;
            WhatsAppText += `Hello JESDA Operations Team,\n\n`;
            WhatsAppText += `I would like to place an order for the following components:\n\n`;
            WhatsAppText += messageOrderLines;
            WhatsAppText += `=========================\n`;
            WhatsAppText += `*GRAND TOTAL: ${symbol}${totalAmount.toLocaleString()} (${currentCurrency})*\n\n`;
            WhatsAppText += `Please confirm availability and sharing logistics processing timelines.`;

            const secureEncodedURL = `https://api.whatsapp.com/send?phone=${businessPhoneNumber}&text=${encodeURIComponent(WhatsAppText)}`;
            window.open(secureEncodedURL, '_blank');
        }

        function toggleCart(open) {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            if (open) {
                overlay.classList.remove('hidden');
                setTimeout(() => { overlay.classList.add('opacity-100'); sidebar.classList.add('open'); }, 10);
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // Keep local cache intact on currency switches
        function setCurrency(currency) {
            currentCurrency = currency;
            const btnINR = document.getElementById('btn-INR');
            const btnUSD = document.getElementById('btn-USD');

            if (currency === 'INR') {
                btnINR.className = "px-3 py-1 rounded-md text-xs font-bold transition bg-blue-600 text-white shadow";
                btnUSD.className = "px-3 py-1 rounded-md text-xs font-bold transition text-gray-400 hover:text-white";
            } else {
                btnUSD.className = "px-3 py-1 rounded-md text-xs font-bold transition bg-blue-600 text-white shadow";
                btnINR.className = "px-3 py-1 rounded-md text-xs font-bold transition text-gray-400 hover:text-white";
            }
            renderStorefront();
            updateCartUI();
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.textContent.toLowerCase() === category.toLowerCase() || (category === 'all' && btn.textContent === 'All')) {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm transition";
                } else {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition";
                }
            });
            renderStorefront();
        }
    </script>
</body>
</html>
